<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06152f" />
  <meta name="description" content="RR Mobiles billing, customers, repairs and stock" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>RR Mobiles Office V11</title>
  <style>
    #boot-diagnostic{display:none;margin:18px;padding:16px;border:2px solid #b42318;border-radius:12px;background:#fff1f0;color:#7a271a;font:14px/1.5 system-ui;white-space:pre-wrap;overflow-wrap:anywhere}
    #boot-diagnostic strong{display:block;margin-bottom:8px}
  </style>
  <script>
    (function () {
      function show(message) {
        var box = document.getElementById('boot-diagnostic');
        if (!box) return;
        box.style.display = 'block';
        box.innerHTML = '<strong>RR Mobiles startup error</strong>';
        var text = document.createElement('div');
        text.textContent = String(message || 'Unknown startup error');
        box.appendChild(text);
      }
      window.addEventListener('error', function (event) {
        show((event.message || 'Script error') + (event.filename ? '\\n' + event.filename + ':' + event.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (event) {
        show('Promise error: ' + (event.reason && event.reason.message ? event.reason.message : event.reason));
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            show('The app JavaScript loaded, but the screen did not render. Please send a screenshot of this message.');
          }
        }, 8000);
      });
    })();
  </script>
</head>
<body>
  <div id="boot-diagnostic"></div>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
